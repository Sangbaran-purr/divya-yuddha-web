    <script>
      /* S-NAV-1 — mobile nav dropdown: toggle open/close, close on selection, outside tap, Escape. (verbatim house pattern) */
      (function () {
        var t = document.querySelector(".nav-toggle");
        var m = document.getElementById("nav-menu");
        if (!t || !m) return;
        function closeMenu() { m.classList.remove("open"); t.setAttribute("aria-expanded", "false"); }
        t.addEventListener("click", function (e) {
          e.stopPropagation();
          if (m.classList.contains("open")) { closeMenu(); }
          else { m.classList.add("open"); t.setAttribute("aria-expanded", "true"); }
        });
        m.addEventListener("click", function (e) { if (e.target.closest("a")) closeMenu(); });
        document.addEventListener("click", function (e) {
          if (m.classList.contains("open") && !m.contains(e.target) && !t.contains(e.target)) closeMenu();
        });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
      })();
      /* S-DASH-NAV-1 — the wallet chip (the person) stays OUTSIDE the menu and shows when connected, exactly as the other
         pages: dashboard.html already loads wallet.js, so the same nameplate lights up. onChange is additive — this rides
         alongside dashboard.js's own #wallet-bar subscriber, it does not replace it. */
      (function () {
        if (!window.DYWallet) return;
        var np = document.getElementById("nameplate-top"), at = document.getElementById("addr-top");
        if (!np || !at) return;
        window.DYWallet.onChange(function (s) {
          if (s.connected && s.address) { at.textContent = window.DYWallet.shortAddr(s.address); np.classList.remove("hidden"); }
          else np.classList.add("hidden");
        });
      })();
    </script>
