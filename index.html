    <!-- GROWTH-1 #9 (owner ruling 2026-11-06): the player counter on the home page too — the first visit's utm tags are

    <!-- GROWTH-1 LANDING (owner design pick C2, 2026-11-06). Copy law: every player-facing word on this page is owner-ruled,
         and tests/suites/landingcopy.js fails if a forbidden word reaches it. The previous home page lives one click deeper,
         at world.html ("Explore the world of Divya Yuddha"). Layout and motion are DY's own; no reference code was copied. -->
    <style>
      @font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
      @font-face { font-family: "EB Garamond"; src: url("assets/fonts/EBGaramond.woff2") format("woff2"); font-weight: 400 500; font-display: swap; }
      :root { --void:#0b0a08; --gold:#d9a84e; --gold-aged:#6b5426; --hair:#8a6f3a; --flame:#ffc96b; --parch:#e9dcc2;
              --display:"Cinzel", Georgia, serif; --text:"EB Garamond", Georgia, serif; --logo-w:min(80vw, 340px); --stage-h:min(40svh, 400px); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html, body { background:var(--void); color:var(--parch); font-family:var(--text); }
      body { min-height:100svh; overflow-x:hidden; }
      /* the game's home-screen plate (landing_plate_port / _wide), darkened only as far as legibility needs */
      .bg { position:fixed; inset:0; z-index:0; background:var(--void) center/cover no-repeat;
            background-image:url(assets/landing/bg_phone.jpg);
            background-image:image-set(url(assets/landing/bg_phone.webp) type("image/webp"), url(assets/landing/bg_phone.jpg) type("image/jpeg")); }
      .bg::after { content:""; position:absolute; inset:0;
            background:radial-gradient(60% 42% at 50% 40%, rgba(11,10,8,.30), transparent 70%),
                       linear-gradient(rgba(11,10,8,.62), rgba(11,10,8,.38) 30%, rgba(11,10,8,.55) 58%, rgba(11,10,8,.92) 82%); }
      .bar { position:relative; z-index:3; display:flex; justify-content:space-between; align-items:center; max-width:1200px; margin:0 auto;
             padding:calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
      .mark img { display:block; width:130px; height:auto; }
      .store { font-family:var(--display); font-size:12px; letter-spacing:.16em; text-decoration:none; color:var(--parch);
               border:1px solid var(--gold-aged); padding:6px 12px; border-radius:999px; background:rgba(11,10,8,.55); }
      .hero { position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:0 20px 28px; display:grid; justify-items:center; text-align:center; }
      .stage { position:relative; width:min(92vw, 560px); height:var(--stage-h); perspective:1100px; }
      .card { position:absolute; left:50%; bottom:-9%; width:40%; aspect-ratio:5/7; margin-left:-20%; transform-style:preserve-3d; transform:rotateX(62deg); }
      .card::after { content:""; position:absolute; inset:-22%; border-radius:50%; background:radial-gradient(closest-side, rgba(255,201,107,.42), transparent); transform:translateZ(-1px); }
      .card img { position:absolute; inset:0; width:100%; height:100%; border-radius:10px; box-shadow:0 18px 40px rgba(0,0,0,.7); }
      .card .back { opacity:0; transform:scaleX(-1); }   /* the back shows only during the first half of the flip (keyframes below) — no backface culling, which WebKit drops */
      .indra { position:absolute; left:50%; bottom:15%; height:90%; aspect-ratio:1; transform:translateX(-50%); filter:drop-shadow(0 0 18px rgba(0,0,0,.55)); }
      .indra img, .indra video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
      .indra video { opacity:0; transition:opacity .25s; }   /* invisible until it is REALLY playing; the still stays under it */
      .indra.live video { opacity:1; } .indra.live img { visibility:hidden; }
      #land-debug { position:fixed; left:8px; right:8px; bottom:8px; z-index:9; font:12px/1.35 ui-monospace, Menlo, monospace; color:#9f9; background:rgba(0,0,0,.82); padding:8px; border-radius:8px; white-space:pre-wrap; word-break:break-all; }
      .spark { position:absolute; left:25%; bottom:10%; width:50%; height:3px; border-radius:2px; background:linear-gradient(90deg, transparent, var(--flame), transparent); opacity:0; }
      .copy { text-shadow:0 2px 12px rgba(0,0,0,.85); }
      h1 { line-height:0; }
      .logo-hero { display:block; margin:0 auto; width:var(--logo-w); height:auto; filter:drop-shadow(0 4px 14px rgba(0,0,0,.7)); }
      .sub { margin:10px auto 0; font-size:clamp(17px, 4.4vw, 21px); line-height:1.38; max-width:32ch; }
      .play { display:inline-block; margin-top:18px; font-family:var(--display); font-weight:600; font-size:clamp(16px, 4.4vw, 19px); letter-spacing:.08em;
              color:#1a1206; text-decoration:none; padding:16px 28px; border-radius:12px; min-width:min(100%, 320px); text-shadow:none;
              background:linear-gradient(180deg, var(--flame), var(--gold) 55%, #b98a35); box-shadow:0 0 0 1px #f3d79b inset, 0 10px 30px rgba(217,168,78,.35); }
      .play:focus-visible, .store:focus-visible, .explore:focus-visible { outline:2px solid var(--flame); outline-offset:3px; }
      .explore { display:inline-block; margin-top:14px; font-size:17px; color:var(--parch); text-decoration:none; border-bottom:1px solid var(--gold-aged); padding-bottom:2px; }
      .clip { position:relative; z-index:2; margin:40px auto 72px; max-width:720px; width:calc(100% - 40px); aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:rgba(11,10,8,.7); }
      .clip:empty { display:none; }   /* the 15-second gameplay clip (ruling #4) is not yet captured: its slot stays empty, and empty is hidden */
      @media (min-width:900px) {
        :root { --logo-w:440px; --stage-h:min(76svh, 640px); }
        .bg { background-image:url(assets/landing/bg_desk.jpg);
              background-image:image-set(url(assets/landing/bg_desk.webp) type("image/webp"), url(assets/landing/bg_desk.jpg) type("image/jpeg")); }
        .bg::after { background:radial-gradient(40% 60% at 30% 52%, rgba(11,10,8,.25), transparent 70%),
                     linear-gradient(90deg, rgba(11,10,8,.50), rgba(11,10,8,.30) 35%, rgba(11,10,8,.62) 60%, rgba(11,10,8,.80)),
                     linear-gradient(rgba(11,10,8,.45), transparent 25%, transparent 75%, rgba(11,10,8,.75)); }
        .bar { padding:14px 20px; } .mark img { width:200px; }
        .hero { grid-template-columns:1.1fr 1fr; align-items:center; text-align:left; min-height:calc(100svh - 140px); justify-items:start; }
        .stage { width:100%; } .logo-hero { margin:0; } .sub { margin-left:0; }
      }
      /* THE OPENING (~1.7 s): the card flips face-up, a spark crosses it, Indra rises out of it */
      @media (prefers-reduced-motion:no-preference) {
        .card { animation:flip .8s cubic-bezier(.65,0,.35,1) .1s both; }
        .spark { animation:spark .4s ease-out .8s both; }
        .card .back { animation:backface .8s linear .1s both; }
        .indra { animation:rise .8s cubic-bezier(.33,1,.68,1) .9s both; transform-origin:50% 100%; }
        .play { animation:glow 3.2s ease-in-out 1.8s infinite; }
      }
      @keyframes flip { from { transform:rotateX(62deg) rotateY(180deg); } to { transform:rotateX(62deg) rotateY(0deg); } }
      @keyframes spark { 0% { opacity:0; transform:scaleX(1); } 35% { opacity:1; transform:scaleX(1.6); } 100% { opacity:0; transform:scaleX(1.6); } }
      @keyframes backface { 0%, 49.9% { opacity:1; } 50%, 100% { opacity:0; } }
      @keyframes rise { from { opacity:0; transform:translateX(-50%) translateY(50px) scaleY(.6); } to { opacity:1; transform:translateX(-50%); } }
      @keyframes glow { 0%, 100% { box-shadow:0 0 0 1px #f3d79b inset, 0 10px 30px rgba(217,168,78,.35); } 50% { box-shadow:0 0 0 1px #f3d79b inset, 0 10px 44px rgba(255,201,107,.6); } }
    </style>

  <body>
    <div class="bg" aria-hidden="true"></div>
    <header class="bar">

    <main class="hero">

        </div>
        <div class="spark"></div>
        <div class="indra" id="land-indra-wrap">
          <img src="assets/landing/indra_poster.webp" width="640" height="640" alt="" decoding="async" />
          <video id="land-indra" muted loop playsinline preload="none" disablepictureinpicture></video>
        </div>
      </div>
      <div class="copy">
        <h1><img class="logo-hero" src="assets/landing/logo_hero.webp" width="880" height="570" fetchpriority="high" alt="Divya Yuddha — Battle of the Celestials" /></h1>
        <p class="sub">A free card battle game inspired by Indian mythology. Play in your browser.</p>
        <a class="play" id="land-play" href="game/index.html?v=9f91457&amp;play=free">Play free — no download</a><br />
        <a class="explore" href="world.html">Explore the world of Divya Yuddha →</a>
      </div>
    </main>
    <section class="clip" id="land-clip" aria-hidden="true"></section>
    <script>
    (function () {
      "use strict";
      var UTM = ["utm_source", "utm_medium", "utm_campaign"];
      function q(o) { var a = []; for (var k in o) if (o[k]) a.push(k + "=" + encodeURIComponent(o[k])); return a.join("&"); }
      function addQuery(href, extra) { return extra ? href.replace(/(#.*)?$/, function (h) { return (/\?/.test(href) ? "&" : "?") + extra + (h || ""); }) : href; }
      // #9 — the Play-free button carries the tags THIS visit arrived with into the game
      var inc = {}; UTM.forEach(function (k) { var m = location.search.match(new RegExp("[?&]" + k + "=([^&#]*)")); if (m) { try { inc[k] = decodeURIComponent(m[1].replace(/\+/g, " ")); } catch (e) {} } });
      var play = document.getElementById("land-play"); play.href = addQuery(play.getAttribute("href"), q(inc));
      // #17/#20 — the Store link carries the player's FIRST-TOUCH tags (the counter remembers them; untagged = none)
      function firstTouch() { try { var s = window.DY_COUNT && window.DY_COUNT.state(); if (s && s.src && s.src.s && s.src.s !== "direct") return { utm_source: s.src.s, utm_medium: s.src.m, utm_campaign: s.src.c }; } catch (e) {} return {}; }
      document.addEventListener("DOMContentLoaded", function () { var st = document.getElementById("land-store"); st.href = addQuery(st.getAttribute("href"), q(firstTouch())); });
      // ALWAYS above the fold: on a short phone the hero logo, then the stage, give way until the button fits whole
      function fit() {
        var root = document.documentElement, btn = play, h = window.innerHeight;
        root.style.removeProperty("--logo-w"); root.style.removeProperty("--stage-h");
        if (window.innerWidth >= 900) return;
        var logo = document.querySelector(".logo-hero"), stage = document.querySelector(".stage");
        var lw = logo.getBoundingClientRect().width, sh = stage.getBoundingClientRect().height, guard = 0;
        while (btn.getBoundingClientRect().bottom > h - 8 && guard++ < 60) {
          if (lw > 200) { lw -= 10; root.style.setProperty("--logo-w", lw + "px"); }
          else if (sh > 120) { sh -= 10; root.style.setProperty("--stage-h", sh + "px"); }
          else break;
        }
      }
      fit(); addEventListener("resize", fit); addEventListener("load", fit);   // the logo and the fonts can grow the column after first paint: fit again once they land
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      // Indra with real transparency, loaded only after the page: WebKit (Safari, every iPhone browser) gets HEVC-with-alpha
      // (Apple's own encoder — WebKit cannot decode ffmpeg's), everyone else VP9-with-alpha. THE STILL ALWAYS STANDS IN: the
      // video is shown only once it is really playing, and if it never plays (reduced motion, Low Power Mode, an error) the
      // still simply stays. A WebKit browser is never handed the WebM: it would play it with a black box.
      var dbg = /[?&]debug=1(&|$)/.test(location.search), log = [];
      function note(t) { if (!dbg) return; log.push(((performance.now() / 1000).toFixed(1)) + "s " + t); paint(); }
      function paint() {
        var v = document.getElementById("land-indra"), card = document.querySelector(".card"), el = document.getElementById("land-debug");
        if (!el) { el = document.createElement("div"); el.id = "land-debug"; document.body.appendChild(el); }
        el.textContent = "DEBUG · src: " + (v.currentSrc || v.getAttribute("src") || "(none)") + "\nreadyState " + v.readyState + " · paused " + v.paused + " · error " + (v.error ? v.error.code : "none")
          + " · live " + document.getElementById("land-indra-wrap").classList.contains("live") + "\nreduced-motion " + !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
          + " · card " + getComputedStyle(card).transform.slice(0, 40) + "\n" + navigator.userAgent.slice(0, 90) + "\n" + log.slice(-6).join("\n");
      }
      if (dbg) { note("debug on"); setInterval(paint, 1000); }
      addEventListener("load", function () {
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { note("reduced motion: still only"); return; }
        var v = document.getElementById("land-indra"), wrap = document.getElementById("land-indra-wrap"), ua = navigator.userAgent;
        var webkit = /iP(hone|ad|od)/.test(ua) || (/Safari\//.test(ua) && !/Chrome|Chromium|Android|Edg\//.test(ua)) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        ["loadedmetadata", "canplay", "playing", "pause", "stalled", "waiting"].forEach(function (e) { v.addEventListener(e, function () { note(e); }); });
        v.addEventListener("playing", function () { wrap.classList.add("live"); });
        v.addEventListener("error", function () { wrap.classList.remove("live"); note("error " + (v.error ? v.error.code : "?") + " — the still stays"); });
        v.src = webkit ? "assets/landing/indra_hevc.mov" : "assets/landing/indra.webm";
        note("chose " + (webkit ? "HEVC (WebKit)" : "WebM (VP9)"));
        var p = v.play(); if (p && p.catch) p.catch(function (e) { note("play() refused: " + (e && e.name) + " — the still stays"); });
      });
    })();
    </script>
