<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Divya Yuddha — Daily Puzzle</title>
    <meta name="description" content="One position, one winning play. A new puzzle every day." />
    <link rel="icon" href="../../assets/brand/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="preload" href="../../assets/fonts/Cinzel.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../assets/fonts/EBGaramond.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../../css/threshold.css?v=s1g" />
    <link rel="stylesheet" href="daily.css?v=d6" />
    <link rel="stylesheet" href="../shared/mini.css?v=g2" />
  </head>
  <body class="daily">
    <!-- MINI-GAMES-2 (owner ruling 2026-10-16): the game's MULLIGAN background behind the page (dims while the battle plays) -->
    <div class="mg-stage" aria-hidden="true"><div class="mg-plate"></div><div class="mg-dim"></div><div class="mg-vig"></div></div>
    <!-- MINI-GAMES-1 R2 — the Daily Puzzle. Free for everyone: no wallet, no Torana, no DYC, no badges, no leaderboard.
         Daily Puzzle Effects R2: #dd-game holds the real battle screen in puzzle mode (an iframe of ../../game/, built by
         page.js) and the page's own result cover over it; the page's own board is the fallback if the battle cannot start.
         Not linked from the site yet (owner ruling: the owner decides where it is linked from). -->
    <header class="dd-top">
      <a class="dd-crest" href="../../index.html">
        <img class="brand-logo" src="../../assets/brand/logo.webp" width="460" height="298" alt="Divya Yuddha — Battle of the Celestials" />
      </a>
      <!-- MINI-GAMES-2 (owner ruling 2026-10-16): the mini games' shared way home, in the mulligan's button style -->
      <a class="mg-btn mg-back dd-home" href="https://sangbaran-purr.github.io/divya-yuddha/" data-back-to-game>← Back to the game</a>
    </header>
    <main class="dd">
      <h1 class="dd-h1">The Daily Puzzle</h1>
      <p class="dd-epithet">One field. One move. One victory.</p>

      <section id="dd-play" hidden>
        <p class="dd-meta"><span id="dd-date"></span> · <span id="dd-diff"></span></p>
        <h2 class="dd-h2" id="dd-ptitle"></h2>
        <p id="dd-archive" class="dd-archive" hidden></p>
        <p id="dd-msg" role="status" aria-live="polite"></p>
        <div id="dd-game"></div>
        <div id="dd-detail" class="dd-detail" hidden></div>
        <div id="dd-actions" class="dd-actions"></div>

        <section id="dd-after" class="dd-after mg-panel" hidden>
          <h3 class="dd-h3">How it was won</h3>
          <p id="dd-explain" class="dd-explain"></p>
          <p id="dd-afternote" class="dd-afternote"></p>
          <dl class="dd-stats">
            <div class="mg-stat"><dt>Streak</dt><dd id="dd-streak">0</dd></div>
            <div class="mg-stat"><dt>Best streak</dt><dd id="dd-best">0</dd></div>
            <div class="mg-stat"><dt>Next puzzle in</dt><dd id="dd-next"></dd></div>
          </dl>
        </section>
      </section>

      <!-- NO PUZZLE TODAY (owner ruling 2026-10-14): one line, then the earlier puzzles. Before the first puzzle:
           "The first Daily Puzzle arrives on <day date month>." (from the data); after a batch: "A new puzzle is on its
           way. Try an earlier one below." -->
      <section id="dd-none" class="dd-none" hidden></section>

      <section id="dd-past" class="dd-past" hidden>
        <h3 class="dd-h3">Earlier puzzles</h3>
        <ul id="dd-pastlist"></ul>
      </section>

      <p id="dd-store" class="dd-store"></p>
    </main>

    <div id="dd-confirm" class="dd-modal" role="dialog" aria-modal="true" aria-labelledby="dd-confirm-q" hidden>
      <div class="dd-modalbox mg-panel">
        <p id="dd-confirm-q">This ends your streak. Show the answer?</p>
        <div class="dd-actions">
          <button type="button" id="dd-confirm-yes" class="dd-btn mg-btn dd-reveal">Show the answer</button>
          <button type="button" id="dd-confirm-no" class="dd-btn mg-btn">Keep trying</button>
        </div>
      </div>
    </div>

    <!-- the site's engine copy (byte-identical to the game's); its top-level declarations become page globals -->
    <script src="../../game/src/engine.js?v=33d0757"></script>
    <script src="puzzle-core.js?v=d1"></script>
    <script src="daily.js?v=d2"></script>
    <script src="notes.js?v=d8"></script>
    <script>window.DY_DAILY_V = "d8";</script>
    <script src="page.js?v=d7"></script>
    <script src="../shared/back.js?v=g1"></script>
  </body>
</html>
